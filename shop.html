<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sản phẩm — Mô Bedding</title>
  <meta name="description" content="Ga trải giường, vỏ chăn, vỏ gối lụa tre vẽ tay của Mô Bedding. Lọc theo loại, bộ sưu tập và màu sắc.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Petrona:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="wrap reveal">
      <p class="crumbs"><a href="index.html" data-en="Home">Trang chủ</a> / <span data-en="Shop">Sản phẩm</span></p>
      <h1 data-en="Shop">Sản phẩm</h1>
      <p class="lead" data-en="Hand-drawn bamboo silk for every corner of the bed — shop by need, by collection or by the colour you love.">Lụa tre vẽ tay cho từng góc giường — chọn theo nhu cầu, theo bộ sưu tập hay theo màu bạn thương.</p>
    </div>
  </section>

  <div class="wrap shop">
    <aside class="filters" aria-label="Bộ lọc">
      <div><h4 data-en="Category">Loại sản phẩm</h4><div id="fType"></div></div>
      <div><h4 data-en="Collection">Bộ sưu tập</h4><div id="fColl"></div></div>
      <div><h4 data-en="Colour">Màu</h4><div class="swatches" id="fColor"></div></div>
    </aside>
    <div>
      <div class="shop__bar">
        <span id="shopCount"></span>
        <select id="sort" aria-label="Sắp xếp">
          <option value="featured" data-en="Featured">Nổi bật</option>
          <option value="low" data-en="Price: low to high">Giá: thấp → cao</option>
          <option value="high" data-en="Price: high to low">Giá: cao → thấp</option>
        </select>
      </div>
      <div class="products products--grid" id="shopGrid"></div>

      <div class="banner reveal">
        <div>
          <p class="eyebrow" data-en="Not sure where to start?">Chưa biết chọn gì?</p>
          <h3 data-en="Build a bundle and give each piece its own colour.">Phối một bộ giường, mỗi món một màu theo ý bạn.</h3>
        </div>
        <a class="btn btn--solid" href="index.html#bundle" data-en="Build your bed">Phối bộ giường</a>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
