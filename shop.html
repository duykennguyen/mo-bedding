<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sản phẩm — Mô Bedding</title>
  <meta name="description" content="Vỏ gối vẽ tay, chăn throw artwork, chăn ga lụa tre và ruột gối của Mô Bedding. Lọc theo loại, bộ sưu tập và màu sắc.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gotu&family=Qwitcher+Grypen&family=Open+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260917o">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="wrap reveal">
      <p class="crumbs"><a href="index.html" data-en="Home">Trang chủ</a> / <span data-en="Shop">Sản phẩm</span></p>
      <h1 data-en="Shop">Sản phẩm</h1>
      <p class="lead" data-en="Pick a lover for your bed — by collection, by the words it whispers, or by the colour that makes you want to lie down.">Chọn một “người tình” cho chiếc giường — theo bộ sưu tập, theo câu chữ nó thì thầm, hay theo màu khiến bạn chỉ muốn nằm xuống.</p>
    </div>
  </section>

  <div class="wrap shop">
    <aside class="filters" aria-label="Bộ lọc">
      <div><h4 data-en="Category">Loại sản phẩm</h4><div id="fType"></div></div>
      <div><h4 data-en="Collection">Bộ sưu tập</h4><div id="fColl"></div></div>
      <div><h4 data-en="Colour">Màu</h4><div class="swatches" id="fColor"></div></div>
    </aside>
    <div>
      <div class="shop__bar">
        <span id="shopCount"></span>
        <select id="sort" aria-label="Sắp xếp">
          <option value="featured" data-en="Featured">Mô gợi ý</option>
          <option value="low" data-en="Price: low to high">Giá: thấp → cao</option>
          <option value="high" data-en="Price: high to low">Giá: cao → thấp</option>
        </select>
      </div>
      <div class="products products--grid" id="shopGrid"></div>

      <div class="banner reveal">
        <div>
          <p class="eyebrow" data-en="Can't decide?">Chưa biết chọn gì?</p>
          <h3 data-en="Message Mô — we'll help you dress your bed, one on one.">Nhắn cho Mô — mình sẽ cùng bạn phối một chiếc giường thật riêng.</h3>
        </div>
        <a class="btn btn--solid" href="https://www.instagram.com/modiphe/" target="_blank" rel="noopener" data-en="Message Mô">Nhắn Mô</a>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/main.js?v=20260917o"></script>
</body>
</html>
